[project]
name = "bakemagic"
version = "0.1.0"
description = "Bakery management API built with FastAPI, SQLModel and PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165",
    "sqlmodel>=0.0.50",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "pydantic[email]>=2.14",
    "pydantic-settings>=2.16",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "httpx>=0.28",
    "ruff>=0.17",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import shared helpers as `tests.<module>`

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Ruff's defaults (pyflakes plus pycodestyle errors), plus import sorting,
# pyupgrade for modern syntax, and bugbear for likely bugs.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The migration template always imports sa and sqlmodel, used or not.
"migrations/versions/*" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters with calls in defaults; that's the intended usage.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "fastapi.Query"]
